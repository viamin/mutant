version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: bundler
    directory: /test_app
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      test-app-dependencies:
        update-types:
          - minor
          - patch
          - major
