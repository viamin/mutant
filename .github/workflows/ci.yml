name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3']
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rspec spec/unit

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: rspec
            command: bundle exec rspec spec/integration/mutant/rspec_spec.rb
          - suite: minitest
            command: bundle exec rspec spec/integration/mutant/minitest_spec.rb
          - suite: generation
            command: bundle exec rspec spec/integration/mutant/corpus_spec.rb
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: ${{ matrix.command }}

  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake metrics:rubocop
      - run: bundle exec rake metrics:reek

  mutant:
    runs-on: ubuntu-latest
    env:
      MUTANT_JOBS: 4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Set mutant diff base
        shell: bash
        run: |
          base_ref="${{ github.base_ref || 'main' }}"

          git fetch --no-tags --prune --depth=1 origin "${base_ref}:refs/remotes/origin/${base_ref}"

          merge_base() {
            git merge-base HEAD "$1" 2>/dev/null || true
          }

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"

            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --prune --depth=1 origin "${base_sha}" || true
            fi

            since="$(merge_base "${base_sha}")"
            [[ -n "${since}" ]] || since="$(merge_base "origin/${base_ref}")"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]] &&
               git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            since="${{ github.event.before }}"
          else
            since="$(merge_base "origin/${base_ref}")"
          fi

          [[ -n "${since}" ]] || since="HEAD~1"

          echo "MUTANT_SINCE=$since" >> "$GITHUB_ENV"
      - run: bundle exec rake metrics:mutant
