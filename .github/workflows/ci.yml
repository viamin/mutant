name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4']
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rspec spec/unit

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: '3.3'
            suite: rspec
            command: bundle exec rspec spec/integration/mutant/rspec_spec.rb
          - ruby-version: '3.3'
            suite: minitest
            command: bundle exec rspec spec/integration/mutant/minitest_spec.rb
          - ruby-version: '3.3'
            suite: generation
            command: bundle exec rspec spec/integration/mutant/corpus_spec.rb
          - ruby-version: '3.4'
            suite: rspec
            command: bundle exec rspec spec/integration/mutant/rspec_spec.rb
          - ruby-version: '3.4'
            suite: minitest
            command: bundle exec rspec spec/integration/mutant/minitest_spec.rb
          - ruby-version: '3.4'
            suite: generation
            command: bundle exec rspec spec/integration/mutant/corpus_spec.rb
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: ${{ matrix.command }}

  metrics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4']
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rake metrics:rubocop
      - run: bundle exec rake metrics:reek

  mutant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4']
    env:
      MUTANT_JOBS: 4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Set mutant diff base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "MUTANT_SINCE=$(git merge-base HEAD ${{ github.event.pull_request.base.sha }})" >> "$GITHUB_ENV"
          else
            echo "MUTANT_SINCE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
      - run: bundle exec rake metrics:mutant
